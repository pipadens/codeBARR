<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barcode & QR Studio Full-Stack</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans select-none">

    <header class="bg-slate-900 border-b border-slate-800 px-4 py-3 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center gap-2">
            <div class="bg-indigo-600 p-2 rounded-lg text-white font-bold text-lg">⚡</div>
            <div>
                <h1 class="font-bold text-lg leading-tight text-indigo-400">Barcode & QR Studio</h1>
                <p class="text-xs text-slate-400">Flask + SQLite Base de Datos</p>
            </div>
        </div>
    </header>

    <nav class="flex border-b border-slate-800 bg-slate-900/50 backdrop-blur">
        <button onclick="switchTab('generator')" id="tabGen" class="flex-1 py-3 text-center font-medium text-sm border-b-2 border-indigo-500 text-indigo-400 transition cursor-pointer">
            🖨️ Generador y Base de Datos
        </button>
        <button onclick="switchTab('scanner')" id="tabScan" class="flex-1 py-3 text-center font-medium text-sm border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition cursor-pointer">
            📷 Escáner con Auto-guardado
        </button>
    </nav>

    <main class="flex-1 max-w-xl w-full mx-auto p-4 pb-20 space-y-6">
        
        <!-- VISTA GENERADOR -->
        <section id="viewGenerator" class="space-y-4">
            <div class="bg-slate-900 p-5 rounded-2xl border border-slate-800 shadow-xl space-y-4">
                <h2 class="text-base font-semibold text-slate-200 flex items-center gap-2">
                    <span>🛠️</span> Crear y Almacenar
                </h2>

                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Formato</label>
                    <select id="codeType" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-slate-200 text-sm focus:outline-none focus:border-indigo-500">
                        <option value="qrcode">Código QR Standard</option>
                        <option value="url">URL Web (Almacenar enlaces)</option>
                        <option value="ean13">EAN-13 (Retail)</option>
                        <option value="code128">Code 128 (Alfanumérico)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Contenido / URL</label>
                    <input type="text" id="inputText" value="https://miweb.com" placeholder="Introduce URL o datos..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-slate-200 text-sm focus:outline-none focus:border-indigo-500 font-mono">
                </div>

                <button id="saveDbBtn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-3 rounded-xl transition text-sm flex items-center justify-center gap-2 cursor-pointer shadow-lg shadow-emerald-600/20">
                    <span>💾</span> Guardar URL / Código en Base de Datos
                </button>
            </div>

            <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 shadow-xl flex flex-col items-center justify-center gap-4">
                <div class="bg-white p-6 rounded-xl shadow-inner min-w-[220px] min-h-[220px] flex items-center justify-center overflow-auto max-w-full">
                    <canvas id="qrCanvas" class="max-w-full"></canvas>
                    <svg id="barcodeSvg" class="max-w-full hidden"></svg>
                </div>
            </div>

            <!-- HISTORIAL / BASE DE DATOS -->
            <div class="bg-slate-900 p-5 rounded-2xl border border-slate-800 shadow-xl space-y-4">
                <div class="flex justify-between items-center">
                    <h2 class="text-base font-semibold text-slate-200 flex items-center gap-2">
                        <span>🗄️</span> Registros Almacenados
                    </h2>
                    <button onclick="cargarCodigos()" class="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg border border-slate-700 transition cursor-pointer">Actualizar</button>
                </div>
                <div id="dbList" class="space-y-2 max-h-64 overflow-y-auto pr-1">
                    <!-- Dinámico -->
                </div>
            </div>
        </section>

        <!-- VISTA ESCÁNER -->
        <section id="viewScanner" class="space-y-4 hidden">
            <div class="bg-slate-900 p-5 rounded-2xl border border-slate-800 shadow-xl space-y-4">
                <h2 class="text-base font-semibold text-slate-200 flex items-center gap-2">
                    <span>📷</span> Escáner con Guardado Automático
                </h2>
                <p class="text-xs text-slate-400">Todo código escaneado se guardará de inmediato en la base de datos.</p>
                
                <div id="reader" class="w-full bg-slate-950 rounded-xl overflow-hidden border border-slate-800 min-h-[260px] flex items-center justify-center"></div>
            </div>

            <div class="bg-slate-900 p-5 rounded-2xl border border-slate-800 shadow-xl space-y-3">
                <label class="block text-xs font-medium text-slate-400">Último Código Detectado:</label>
                <input type="text" id="scanResult" readonly placeholder="Esperando lectura..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-slate-200 text-sm font-mono focus:outline-none">
            </div>
        </section>

    </main>

    <script>
        function switchTab(tab) {
            const genSec = document.getElementById('viewGenerator');
            const scanSec = document.getElementById('viewScanner');
            const tabGen = document.getElementById('tabGen');
            const tabScan = document.getElementById('tabScan');

            if (tab === 'generator') {
                genSec.classList.remove('hidden');
                scanSec.classList.add('hidden');
                tabGen.className = "flex-1 py-3 text-center font-medium text-sm border-b-2 border-indigo-500 text-indigo-400 transition cursor-pointer";
                tabScan.className = "flex-1 py-3 text-center font-medium text-sm border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition cursor-pointer";
                stopScanner();
                cargarCodigos();
            } else {
                genSec.classList.add('hidden');
                scanSec.classList.remove('hidden');
                tabScan.className = "flex-1 py-3 text-center font-medium text-sm border-b-2 border-indigo-500 text-indigo-400 transition cursor-pointer";
                tabGen.className = "flex-1 py-3 text-center font-medium text-sm border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition cursor-pointer";
                startScanner();
            }
        }

        const codeType = document.getElementById('codeType');
        const inputText = document.getElementById('inputText');
        const qrCanvas = document.getElementById('qrCanvas');
        const barcodeSvg = document.getElementById('barcodeSvg');

        function generateCode() {
            const type = codeType.value;
            const text = inputText.value.trim();
            if (!text) return;

            if (type === 'qrcode' || type === 'url') {
                qrCanvas.classList.remove('hidden');
                barcodeSvg.classList.add('hidden');
                QRCode.toCanvas(qrCanvas, text, { width: 220, margin: 2 }, err => {});
            } else {
                qrCanvas.classList.add('hidden');
                barcodeSvg.classList.remove('hidden');
                try {
                    JsBarcode(barcodeSvg, text, { format: type.toUpperCase(), width: 2, height: 80, displayValue: true });
                } catch (e) {}
            }
        }

        [codeType, inputText].forEach(el => el.addEventListener('input', generateCode));

        // Guardar manualmente en la base de datos
        document.getElementById('saveDbBtn').addEventListener('click', async () => {
            const tipo = codeType.value;
            const contenido = inputText.value.trim();
            if (!contenido) return alert('El contenido está vacío');

            const res = await fetch('/api/guardar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ tipo, contenido })
            });

            if (res.ok) {
                alert('¡Guardado exitosamente en la base de datos!');
                cargarCodigos();
            }
        });

        // Obtener registros de la base de datos
        async function cargarCodigos() {
            const res = await fetch('/api/codigos');
            const data = await res.json();
            const list = document.getElementById('dbList');
            list.innerHTML = '';

            if (data.length === 0) {
                list.innerHTML = '<p class="text-xs text-slate-500 text-center py-4">No hay registros almacenados.</p>';
                return;
            }

            data.forEach(item => {
                const div = document.createElement('div');
                div.className = "flex justify-between items-center bg-slate-950 p-3 rounded-xl border border-slate-800 text-xs gap-2";
                div.innerHTML = `
                    <div class="overflow-hidden">
                        <span class="font-bold text-indigo-400 uppercase">[${item.tipo}]</span>
                        <span class="text-slate-200 font-mono ml-2 break-all">${item.contenido}</span>
                        <div class="text-[10px] text-slate-500 mt-0.5">${item.fecha}</div>
                    </div>
                    <button onclick="borrarRegistro(${item.id})" class="bg-rose-600/20 hover:bg-rose-600 text-rose-400 hover:text-white px-3 py-1.5 rounded-lg transition cursor-pointer font-medium shrink-0">Borrar</button>
                `;
                list.appendChild(div);
            });
        }

        // Borrar registro de la base de datos
        async function borrarRegistro(id) {
            if (!confirm('¿Estás segura de eliminar este registro?')) return;
            const res = await fetch(`/api/borrar/${id}`, { method: 'DELETE' });
            if (res.ok) {
                cargarCodigos();
            }
        }

        let html5QrCode = null;
        const scanResult = document.getElementById('scanResult');

        function startScanner() {
            if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 15, qrbox: { width: 220, height: 220 } },
                async (decodedText) => {
                    scanResult.value = decodedText;
                    if (navigator.vibrate) navigator.vibrate(100);
                    
                    // Guarda el código escaneado automáticamente en la base de datos
                    await fetch('/api/guardar', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ tipo: 'escaneado', contenido: decodedText })
                    });
                },
                (error) => {}
            ).catch(err => {});
        }

        function stopScanner() {
            if (html5QrCode && html5QrCode.isScanning) {
                html5QrCode.stop().catch(err => {});
            }
        }

        generateCode();
        cargarCodigos();
    </script>
</body>
</html>
